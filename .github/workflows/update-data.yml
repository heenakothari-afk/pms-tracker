name: Update APMI data

on:
  schedule:
    - cron: "30 3 10,20,28 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python apmi_scraper.py --out docs/apmi_pms_data.xlsx --json docs/data.json
      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/apmi_pms_data.xlsx
          git diff --cached --quiet || (git commit -m "Update APMI data" && git push)
